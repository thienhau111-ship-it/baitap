<!DOCTYPE html>
<html lang="vi">
<head>
<title>中文作業</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14305a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand:"LXGW WenKai TC","Kaiti TC","BiauKai","DFKai-SB","標楷體",serif;
    --bg:#eef2f8; --card:#ffffff; --ink:#172235; --muted:#5b6779; --line:#d8e0eb;
    --navy:#14305a; --accent:#1f56a3; --accent-2:#5b8fd0; --soft:#e7eef9;
    --ok:#22744a; --ok-soft:#e3f2e9; --warn:#985f00; --warn-soft:#fff2d4; --danger:#b3261e; --danger-soft:#fbe9e7;
    --grade:#5a3fb0; --grade-soft:#efeafc;
    --zh:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",sans-serif;
    --r:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 -apple-system,"Segoe UI",Roboto,"Noto Sans",var(--zh),sans-serif}
  .zh{font-family:var(--zh)}
  .hidden{display:none!important}
  .muted{color:var(--muted)} .small{font-size:14px} .center{text-align:center}
  .err{color:var(--danger);font-weight:600}

  /* Thanh tiêu đề */
  .mast{background:var(--navy);color:#fff;padding-top:env(safe-area-inset-top)}
  .mast .in{max-width:680px;margin:0 auto;padding:14px 16px 12px;display:flex;align-items:center;gap:12px}
  .mast h1{margin:0;font:700 28px/1.1 var(--brand);letter-spacing:4px}
  .mast .who{margin-left:auto;display:flex;align-items:center;gap:8px;font-size:14px;min-width:0}
  .mast .who b{font-family:var(--zh);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mast .who button{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:4px 10px;font:inherit;font-size:13px;cursor:pointer;white-space:nowrap}
  .mast::after{content:"";display:block;height:4px;background:linear-gradient(90deg,var(--accent-2),#9cc0ec)}

  .wrap{max-width:680px;margin:0 auto;padding:14px 14px calc(110px + env(safe-area-inset-bottom))}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin:12px 0;box-shadow:0 1px 2px rgba(20,48,90,.05)}
  h2{font-size:19px;line-height:1.35;color:var(--navy);margin:0 0 8px}
  h3{font-size:17px;color:var(--navy);margin:0 0 6px}

  /* Nút và ô nhập */
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;border-radius:999px;padding:13px 20px;font:inherit;font-weight:700;cursor:pointer;background:var(--accent);color:#fff;min-height:48px}
  .btn.block{width:100%}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.ok{background:var(--ok)}
  .btn:disabled{opacity:.55;cursor:default}
  .back{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--accent);font:inherit;font-weight:700;padding:8px 2px;cursor:pointer}
  label.lbl{display:block;font-weight:700;margin:14px 0 6px}
  input[type=text],textarea{width:100%;font:inherit;font-family:var(--zh),inherit;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);-webkit-appearance:none}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--soft)}
  textarea{min-height:96px;resize:vertical}
  textarea.essay{min-height:280px;line-height:1.85}
  .hint{color:var(--muted);font-size:14px;margin:6px 0 0}

  /* Đăng nhập */
  .login h2{font-size:22px}
  .login input{font-size:22px;text-align:center;letter-spacing:2px;padding:14px}
  .login .btn{margin-top:12px}

  /* Trang chủ */
  .hello{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin:6px 2px 2px}
  .hello b{font:700 24px var(--zh);color:var(--navy)}
  .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:12px 0}
  .stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
  .stat b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
  .stat span{font-size:13px;color:var(--muted)}
  .stat.todo b{color:var(--accent)} .stat.sub b{color:var(--warn)} .stat.gr b{color:var(--grade)}
  .asg{display:block;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-left:6px solid var(--line);border-radius:14px;padding:14px 14px 12px;margin:10px 0;font:inherit;color:inherit;cursor:pointer}
  .asg:active{transform:scale(.99)}
  .asg .t{font-weight:700;font-size:17px;line-height:1.35}
  .asg .meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;margin-top:8px;font-size:14px;color:var(--muted)}
  .asg .go{display:block;margin-top:8px;font-weight:700;color:var(--accent);font-size:15px}
  .asg.todo{border-left-color:var(--accent)}
  .asg.submitted{border-left-color:#e2a72e}
  .asg.graded{border-left-color:var(--grade)}
  .asg.missed{border-left-color:#c4ccd8;opacity:.8}
  .chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;white-space:nowrap}
  .chip.todo{background:var(--soft);color:var(--accent)}
  .chip.submitted{background:var(--warn-soft);color:var(--warn)}
  .chip.graded{background:var(--grade-soft);color:var(--grade)}
  .chip.missed{background:#eef1f5;color:var(--muted)}
  .chip.draft{background:#fff;border:1px dashed var(--accent);color:var(--accent);font-weight:600}

  /* Làm bài */
  .deadline{display:inline-block;font-size:14px;color:var(--accent);background:var(--soft);border-radius:8px;padding:3px 10px;margin-top:2px}
  .notice{border-radius:12px;padding:12px 14px;margin:12px 0;font-size:15px;line-height:1.5}
  .notice.info{background:var(--soft);color:#173f74}
  .notice.warn{background:var(--warn-soft);color:#6d4500}
  .notice.ok{background:var(--ok-soft);color:#165234}
  .item{margin:16px 0 4px}
  .item .q{font-weight:600}
  .opts{display:grid;gap:8px;margin-top:8px}
  .opt{position:relative;display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;background:#fff;cursor:pointer;font-family:var(--zh);font-size:18px;line-height:1.5}
  .opt input{position:absolute;opacity:0;pointer-events:none}
  .opt .lt{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:700 14px -apple-system,"Segoe UI",Roboto,sans-serif;color:#6b7686;margin-top:1px}
  .opt.on{border-color:var(--accent);background:var(--soft)}
  .opt.on .lt{background:var(--accent);border-color:var(--accent);color:#fff}
  .passage{font-family:var(--zh);font-size:18px;line-height:1.9;background:#fffbef;border:1px solid #f0e2b6;border-radius:12px;padding:12px 14px;margin:8px 0;white-space:pre-wrap}
  .mk{display:inline-block;margin-left:8px;border-radius:999px;padding:0 8px;font:700 13px/1.7 -apple-system,"Segoe UI",Roboto,sans-serif;vertical-align:middle}
  .mk.ok{background:#e3f5ea;color:#1d7a4c} .mk.no{background:#fdeaea;color:#c0392b}
  .tag{display:inline-block;font-family:var(--zh);font-weight:700;background:var(--soft);color:var(--accent);border-radius:8px;padding:1px 8px;margin-right:6px}
  .example{border-left:3px solid var(--accent);padding:6px 12px;margin:10px 0;background:#f5f8fd;border-radius:0 8px 8px 0;font-size:15px}
  .instr{font-size:15px} .instr ol{margin:6px 0;padding-left:22px} .instr p{margin:6px 0}
  .ws{display:flex;gap:8px;margin-top:6px}
  .ws input:first-child{flex:0 0 96px}
  .ws input:last-child{flex:1;min-width:0}
  details{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:12px 0;background:#fbfcfe}
  details summary{cursor:pointer;font-weight:700;color:var(--accent)}
  details .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  details table{border-collapse:collapse;width:100%;margin:10px 0;font-size:14px;min-width:420px}
  details th,details td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top;font-family:var(--zh),inherit}
  details th{background:#e8eff9;color:var(--navy)}
  .topics label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;margin:6px 0;cursor:pointer}
  .topics input{margin-top:4px;width:18px;height:18px;flex:none}
  .checks label{display:flex;gap:10px;align-items:center;margin:6px 0}
  .checks input{width:20px;height:20px;flex:none}
  .counter{margin:10px 0 4px;padding:10px 12px;border-radius:10px;background:var(--warn-soft);color:var(--warn)}
  .counter.ok{background:var(--ok-soft);color:var(--ok)}
  .counter .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
  .counter .track{height:6px;border-radius:99px;background:rgba(0,0,0,.08);margin-top:6px;overflow:hidden}
  .counter .fill{height:100%;background:currentColor;border-radius:99px;transition:width .2s}
  .meter{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
  .pill{font-size:13px;border-radius:999px;padding:3px 10px;background:#eef1f5;color:var(--muted)}
  .pill.ok{background:var(--ok-soft);color:var(--ok)}

  /* Xem lại bài và nhận xét */
  .scorebox{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#5a3fb0,#7f63d6);color:#fff;border:0}
  .scorebox .sc{font:800 44px/1 -apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
  .scorebox .sc small{font-size:16px;font-weight:600;opacity:.9;margin-left:2px}
  .scorebox .tx{font-size:14px;line-height:1.45;opacity:.95}
  .fbAll{white-space:pre-wrap;word-break:break-word;font-family:var(--zh),inherit;font-size:16px;line-height:1.65}
  .rv{padding:12px 0;border-bottom:1px dashed #e1e7f0}
  .rv:last-child{border-bottom:0}
  .rv .q{font-weight:600;font-size:15px}
  .rv .mine{margin-top:6px;background:#f6f8fc;border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-family:var(--zh);font-size:18px;line-height:1.6;white-space:pre-wrap;word-break:break-word}
  .rv .mine.empty{color:#9aa3b2;font-size:15px;font-style:italic}
  .rv .key{margin-top:6px;font-size:15px;color:var(--ok);font-family:var(--zh),inherit;word-break:break-word}
  .rv .key b{font-family:-apple-system,"Segoe UI",Roboto,sans-serif;font-size:13px}
  .fb{margin-top:8px;border-left:4px solid var(--grade);background:var(--grade-soft);border-radius:0 10px 10px 0;padding:8px 12px}
  .fb .h{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--grade)}
  .fb .tx{white-space:pre-wrap;word-break:break-word;font-family:var(--zh),inherit;font-size:16px;line-height:1.6;color:#2b1f52}
  .essayView{white-space:pre-wrap;word-break:break-word;font-family:var(--zh);font-size:18px;line-height:1.9;background:#fffdf7;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px}

  /* Thanh nộp bài */
  .bar{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));box-shadow:0 -6px 16px -12px rgba(0,0,0,.3)}
  .bar .in{max-width:680px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
  .bar .st{font-size:13px;color:var(--muted);line-height:1.35;min-width:0}
  #barCount{display:block;font-weight:700;color:var(--warn)} #barCount.ok{color:var(--ok)}
  .bar .btn{flex:none}

  .modal{position:fixed;inset:0;background:rgba(15,20,30,.5);display:flex;align-items:flex-end;justify-content:center;z-index:10}
  .modal .box{background:#fff;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88vh;overflow:auto}
  @media (min-width:600px){.modal{align-items:center;padding:16px}.modal .box{border-radius:18px}}
  .modal ul{padding-left:20px;margin:8px 0}
  .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
  .actions .btn{flex:1 1 140px}
  .big{font-size:52px;line-height:1;color:var(--ok)}
  .spinner{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 1s linear infinite;display:inline-block;vertical-align:middle}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="mast"><div class="in">
  <h1>中文作業</h1>
  <div class="who hidden" id="who"><b id="whoName"></b><button type="button" id="switchBtn">Đổi tên</button></div>
</div></div>

<div class="wrap">
  <!-- Đăng nhập bằng tên -->
  <section id="vLogin" class="hidden">
    <div class="card login center">
      <h2>Bạn là ai?</h2>
      <p class="muted small">Gõ đúng tên tiếng Trung của bạn trong danh sách lớp (chữ phồn thể, đủ họ tên).</p>
      <input id="name" type="text" class="zh" placeholder="例如：阮氏雲" maxlength="30" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button class="btn block" id="loginBtn" type="button">Vào lớp</button>
      <p id="loginErr" class="err small"></p>
    </div>
  </section>

  <!-- Danh sách bài tập -->
  <section id="vHome" class="hidden">
    <div class="hello"><span class="muted">你好，</span><b id="helloName"></b></div>
    <div class="stats" id="stats"></div>
    <div id="asgList"></div>
    <p class="hint center">Bài đã nộp vẫn sửa được cho đến khi giáo viên chấm hoặc hết hạn.</p>
  </section>

  <!-- Làm bài / xem bài -->
  <section id="vWork" class="hidden">
    <button class="back" id="back" type="button">← Danh sách bài tập</button>
    <div id="form"></div>
  </section>

  <!-- Đã nộp -->
  <section id="vDone" class="hidden">
    <div class="card center">
      <div class="big">✓</div>
      <h2 id="doneTitle">Đã nộp bài</h2>
      <p id="doneText" class="muted"></p>
      <button class="btn block" id="doneBack" type="button">Về danh sách bài tập</button>
    </div>
  </section>
</div>

<div class="bar hidden" id="bar">
  <div class="in">
    <span class="st"><span id="barCount" class="hidden"></span><span id="saveState">Bài làm tự lưu trên máy này</span></span>
    <button class="btn" id="submitBtn" type="button">Nộp bài</button>
  </div>
</div>

<div class="modal hidden" id="modal"><div class="box" id="modalBox"></div></div>

<script>
var state = { name: '', asg: null, sub: null, keys: {}, answers: {}, list: [] };
var CJK = /[㐀-鿿豈-﫿]/g;

function $(id){ return document.getElementById(id); }
function el(tag, attrs, kids){
  var e = document.createElement(tag);
  if (attrs) Object.keys(attrs).forEach(function(k){
    if (k === 'text') e.textContent = attrs[k];
    else if (k === 'html') e.innerHTML = attrs[k];
    else if (k === 'cls') e.className = attrs[k];
    else e.setAttribute(k, attrs[k]);
  });
  (kids || []).forEach(function(c){ if (c) e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return e;
}
function store(k, v){ try { if (v === undefined) return localStorage.getItem(k); if (v === null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch(e){ return null; } }
/* Link ứng dụng web Google Apps Script (kết thúc bằng /exec). */
var API_URL = 'https://script.google.com/macros/s/AKfycbymAWR4KKSw85EuveT87cVmqYRevrIdrY7ozV1jr4jJDMTuVa8FOSfbUQWA3OhQasyF/exec';
function call(fn){
  var args = Array.prototype.slice.call(arguments, 1);
  return fetch(API_URL, {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'},
    body: JSON.stringify({fn: fn, args: args}),
    redirect: 'follow',
    credentials: 'omit'
  }).then(function(r){
    if (!r.ok) throw new Error('Máy chủ đang bận (mã ' + r.status + '). Hãy thử lại sau ít phút.');
    return r.json();
  }, function(){
    throw new Error('Không kết nối được máy chủ. Hãy kiểm tra mạng rồi thử lại.');
  }).then(function(res){
    if (!res || !res.ok) throw new Error((res && res.error) || 'Có lỗi xảy ra.');
    return res.data;
  });
}
function errMsg(e){ return (e && e.message) ? e.message.replace(/^Exception:\s*/, '').replace(/^Error:\s*/, '') : String(e); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function show(v){ ['vLogin','vHome','vWork','vDone'].forEach(function(x){ $(x).classList.toggle('hidden', x !== v); }); $('bar').classList.add('hidden'); window.scrollTo(0,0); }
function countCJK(s){ return (String(s || '').match(CJK) || []).length; }
function fmtTime(iso){ if (!iso) return ''; var d = new Date(iso); return ('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2)+' ngày '+('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2); }
function remain(iso){
  var ms = new Date(iso) - new Date();
  if (ms <= 0) return 'đã hết giờ';
  var m = Math.floor(ms / 60000), d = Math.floor(m / 1440), h = Math.floor((m % 1440) / 60), mm = m % 60;
  if (d) return 'còn ' + d + ' ngày ' + h + ' giờ';
  if (h) return 'còn ' + h + ' giờ ' + mm + ' phút';
  return 'còn ' + mm + ' phút';
}
function deadlineText(iso){ return iso ? 'Hạn nộp: ' + fmtTime(iso) + ' (' + remain(iso) + ')' : ''; }
function draftKey(id){ return 'hw:' + state.name + ':' + id; }
function getDraft(id){
  try {
    var d = JSON.parse(store(draftKey(id)) || 'null');
    if (d) return d;
    var old = JSON.parse(store('draft:' + id) || 'null');   // nháp của bản cũ
    if (old && typeof old === 'object' && Object.keys(old).length) return {t: 0, a: old};
  } catch(e){}
  return null;
}

/* ---------- Đăng nhập bằng tên ---------- */
function setUser(name){
  state.name = name; store('hw_name', name);
  $('whoName').textContent = name; $('helloName').textContent = name;
  $('who').classList.remove('hidden');
}
function login(name, silent){
  name = String(name || '').replace(/\s+/g, '');
  if (!name){ $('loginErr').textContent = 'Bạn hãy nhập tên tiếng Trung.'; return; }
  $('loginBtn').disabled = true; $('loginErr').textContent = '';
  call('checkStudent', name).then(function(r){
    $('loginBtn').disabled = false; setUser(r.name); goHome();
  }).catch(function(e){
    $('loginBtn').disabled = false;
    if (silent){ store('hw_name', null); showLogin(); }
    $('loginErr').textContent = errMsg(e);
  });
}
function showLogin(){ $('who').classList.add('hidden'); show('vLogin'); $('name').value = ''; setTimeout(function(){ $('name').focus(); }, 50); }
$('loginBtn').addEventListener('click', function(){ login($('name').value); });
$('name').addEventListener('keydown', function(e){ if (e.key === 'Enter') login($('name').value); });
$('switchBtn').addEventListener('click', function(){ store('hw_name', null); state.name = ''; showLogin(); });

/* ---------- Danh sách bài tập ---------- */
var STATUS = {
  todo:      { chip: 'Chưa làm',            go: 'Làm bài →' },
  submitted: { chip: '✓ Đã nộp · chờ chấm', go: 'Xem và sửa bài →' },
  graded:    { chip: '★ Đã chấm',           go: 'Xem điểm và nhận xét →' },
  missed:    { chip: 'Hết hạn · chưa nộp',  go: '' }
};
function goHome(){
  show('vHome');
  $('asgList').innerHTML = '<div class="card"><span class="spinner"></span> <span class="muted">Đang tải bài tập…</span></div>';
  $('stats').innerHTML = '';
  call('getMyAssignments', state.name).then(function(list){
    state.list = list;
    var n = function(st){ return list.filter(function(a){ return a.status === st; }).length; };
    $('stats').innerHTML = '';
    [['todo', n('todo'), 'Chưa làm'], ['sub', n('submitted'), 'Chờ chấm'], ['gr', n('graded'), 'Đã chấm']].forEach(function(x){
      $('stats').appendChild(el('div', {cls:'stat ' + x[0]}, [el('b', {text: String(x[1])}), el('span', {text: x[2]})]));
    });
    var box = $('asgList'); box.innerHTML = '';
    if (!list.length){ box.appendChild(el('div', {cls:'card muted center', text:'Hiện chưa có bài tập nào.'})); return; }
    var order = {todo:0, submitted:1, graded:2, missed:3};
    list.slice().sort(function(a, b){ return order[a.status] - order[b.status]; }).forEach(function(a){
      var st = STATUS[a.status], draft = a.status === 'todo' && getDraft(a.id);
      var meta = el('div', {cls:'meta'}, [
        el('span', {cls:'chip ' + a.status, text: a.status === 'graded' ? st.chip + ' · ' + a.score + ' điểm' : st.chip}),
        draft ? el('span', {cls:'chip draft', text:'Có bài làm dở'}) : null,
        a.submittedAt ? el('span', {text: 'Nộp lúc ' + fmtTime(a.submittedAt)}) : null,
        a.until && a.active ? el('span', {text: deadlineText(a.until)}) : null,
        a.status === 'submitted' && !a.active ? el('span', {text:'Đã hết hạn sửa'}) : null
      ]);
      var b = el('button', {cls:'asg ' + a.status, type:'button'}, [
        el('div', {cls:'t', text: a.title}), meta,
        st.go ? el('span', {cls:'go', text: a.status === 'submitted' && !a.active ? 'Xem bài đã nộp →' : st.go}) : null
      ]);
      if (a.status === 'missed') b.disabled = true;
      else b.addEventListener('click', function(){ openAsg(a.id); });
      box.appendChild(b);
    });
  }).catch(function(e){
    var m = errMsg(e);
    if (/danh sách lớp/.test(m)){ store('hw_name', null); showLogin(); $('loginErr').textContent = m; return; }
    $('asgList').innerHTML = ''; $('asgList').appendChild(el('div', {cls:'card err', text:'Không tải được bài tập: ' + m}));
  });
}

/* ---------- Mở bài ---------- */
function openAsg(id){
  show('vWork');
  $('form').innerHTML = '<div class="card"><span class="spinner"></span> Đang mở bài tập…</div>';
  call('getMyWork', id, state.name).then(function(r){
    state.asg = r.asg; state.sub = r.sub; state.keys = r.keys || {};
    var meta = state.list.filter(function(a){ return a.id === id; })[0];
    var editable = r.asg.active && !(r.sub && r.sub.returned);
    if (!editable){ renderReview(); return; }
    var d = getDraft(id);
    state.usingDraft = false;
    if (r.sub){
      if (d && d.t > Date.parse(r.sub.lastAt)){ state.answers = d.a || {}; state.usingDraft = d.t; }
      else state.answers = JSON.parse(JSON.stringify(r.sub.answers || {}));
    } else {
      state.answers = (d && d.a) || {};
    }
    renderForm();
  }).catch(function(e){ $('form').innerHTML = ''; $('form').appendChild(el('div', {cls:'card err', text: errMsg(e)})); });
}

/* ---------- Làm bài / sửa bài ---------- */
var saveTimer;
function saveDraft(){
  clearTimeout(saveTimer);
  $('saveState').textContent = 'Đang lưu nháp…';
  saveTimer = setTimeout(function(){
    store(draftKey(state.asg.id), JSON.stringify({t: Date.now(), a: state.answers}));
    $('saveState').textContent = state.sub ? 'Đã lưu nháp · nhớ bấm Cập nhật' : 'Đã lưu nháp trên máy này';
  }, 400);
}

function renderForm(){
  var a = state.asg, f = $('form');
  f.innerHTML = '';
  f.appendChild(el('div', {cls:'card'}, [
    el('h2', {text: a.title}),
    a.until ? el('div', {cls:'deadline', id:'deadline', text: deadlineText(a.until)}) : null,
    state.sub ? el('div', {cls:'notice info'}, [
      el('b', {text:'Bạn đã nộp bài này lúc ' + fmtTime(state.sub.lastAt) + '.'}),
      document.createTextNode(' Có thể sửa rồi bấm '), el('b', {text:'Cập nhật bài nộp'}),
      document.createTextNode('. Khi giáo viên chấm xong, bài sẽ bị khóa và bạn sẽ thấy điểm, nhận xét.')
    ]) : null,
    state.usingDraft ? el('div', {cls:'notice warn', text:'Đang hiện bản nháp chưa nộp trên máy này (lưu lúc ' + fmtTime(new Date(state.usingDraft).toISOString()) + '). Bấm Cập nhật bài nộp để gửi cho giáo viên.'}) : null
  ]));
  (a.sections || []).forEach(function(s){ f.appendChild(s.type === 'essay' ? renderEssay(s) : renderSection(s)); });
  $('submitBtn').textContent = state.sub ? 'Cập nhật bài nộp' : 'Nộp bài';
  $('saveState').textContent = state.sub ? 'Sửa xong nhớ bấm Cập nhật' : 'Bài làm tự lưu trên máy này';
  $('bar').classList.remove('hidden');
  if (!(a.sections || []).some(function(s){ return s.type === 'essay'; })) $('barCount').classList.add('hidden');
}

function itemHead(s, it, i){
  return el('div', {cls:'q'}, [
    it.label ? el('span', {cls:'tag', text: it.label}) : null,
    document.createTextNode(((s.items.length > 1 && !it.label) ? (i + 1) + '. ' : '') + (it.prompt || ''))
  ]);
}

function renderSection(s){
  var c = el('div', {cls:'card'}, [el('h3', {text: s.title})]);
  if (s.instructions) c.appendChild(el('div', {cls:'instr', html: s.instructions}));
  if (s.passage) c.appendChild(el('div', {cls:'passage', text: s.passage}));
  if (s.example) c.appendChild(el('div', {cls:'example'}, [el('div', {text: 'Ví dụ: ' + s.example.q}), el('div', {cls:'zh', text: '→ ' + s.example.a})]));
  (s.items || []).forEach(function(it, i){
    var box = el('div', {cls:'item'}, [itemHead(s, it, i), it.hint ? el('div', {cls:'hint', text: it.hint}) : null]);
    if (it.type === 'word_sentence'){
      var v = state.answers[it.id] || {};
      var w = el('input', {type:'text', cls:'zh', placeholder:'Từ', maxlength:'10'}); w.value = v.word || '';
      var sn = el('input', {type:'text', cls:'zh', placeholder:'Câu của bạn'}); sn.value = v.sentence || '';
      var upd = function(){ state.answers[it.id] = {word: w.value, sentence: sn.value}; saveDraft(); };
      w.addEventListener('input', upd); sn.addEventListener('input', upd);
      box.appendChild(el('div', {cls:'ws'}, [w, sn]));
    } else if (it.type === 'choice'){
      var og = el('div', {cls:'opts'});
      (it.options || []).forEach(function(o, k){
        var L = 'ABCDEFGH'.charAt(k);
        var r = el('input', {type:'radio', name:'opt_' + it.id});
        var lab = el('label', {cls:'opt' + (state.answers[it.id] === L ? ' on' : '')}, [r, el('span', {cls:'lt', text: L}), el('span', {text: o})]);
        r.checked = state.answers[it.id] === L;
        r.addEventListener('change', function(){
          state.answers[it.id] = L; saveDraft();
          Array.prototype.forEach.call(og.children, function(x){ x.classList.remove('on'); }); lab.classList.add('on');
        });
        og.appendChild(lab);
      });
      box.appendChild(og);
    } else {
      var inp = it.type === 'textarea' ? el('textarea', {cls:'zh'}) : el('input', {type:'text', cls:'zh'});
      if (it.placeholder) inp.placeholder = it.placeholder;
      inp.value = state.answers[it.id] || '';
      inp.addEventListener('input', function(){ state.answers[it.id] = inp.value; saveDraft(); });
      box.appendChild(inp);
    }
    c.appendChild(box);
  });
  return c;
}

function renderEssay(s){
  var v = state.answers[s.id] || {topic:'', text:'', checklist:[]};
  state.answers[s.id] = v;
  var c = el('div', {cls:'card'}, [el('h3', {text: s.title})]);
  if (s.instructions) c.appendChild(el('div', {cls:'instr', html: s.instructions}));
  if (s.topics && s.topics.length){
    var t = el('div', {cls:'topics'}, [el('label', {cls:'lbl', text:'Chọn chủ đề'})]);
    s.topics.forEach(function(tp){
      var r = el('input', {type:'radio', name:'topic_' + s.id});
      r.checked = v.topic === tp;
      r.addEventListener('change', function(){ v.topic = tp; saveDraft(); });
      t.appendChild(el('label', null, [r, el('span', {text: tp})]));
    });
    c.appendChild(t);
  }
  if (s.hintsHtml) c.appendChild(el('details', null, [el('summary', {text:'Gợi ý viết bài (bấm để mở)'}), el('div', {cls:'tw', html: s.hintsHtml})]));
  var ta = el('textarea', {cls:'essay zh', placeholder:'Viết đoạn văn của bạn ở đây…'});
  ta.value = v.text || '';
  var meter = el('div', {cls:'meter'}), counter = el('div', {cls:'counter'});
  function upd(){ v.text = ta.value; updateMeter(meter, ta.value); updateCounter(counter, s, ta.value); saveDraft(); }
  ta.addEventListener('input', upd);
  c.appendChild(el('label', {cls:'lbl', text:'Bài viết của bạn'}));
  c.appendChild(ta); c.appendChild(counter); c.appendChild(meter);
  updateMeter(meter, ta.value); updateCounter(counter, s, ta.value);
  if (s.checklist && s.checklist.length){
    var ck = el('div', {cls:'checks'}, [el('label', {cls:'lbl', text:'Tự kiểm tra trước khi nộp'})]);
    s.checklist.forEach(function(item, i){
      var b = el('input', {type:'checkbox'});
      b.checked = !!(v.checklist && v.checklist[i]);
      b.addEventListener('change', function(){ v.checklist = v.checklist || []; v.checklist[i] = b.checked; saveDraft(); });
      ck.appendChild(el('label', null, [b, el('span', {cls:'zh', text: item})]));
    });
    c.appendChild(ck);
  }
  return c;
}

function analyze(text){
  var chk = (state.asg && state.asg.check) || {};
  var used = (chk.words || []).filter(function(w){ return text.indexOf(w) >= 0; });
  var gram = (chk.grammar || []).map(function(g){ var ok = false; try { ok = new RegExp(g.re).test(text); } catch(e){} return {label: g.label, ok: ok}; });
  return {chars: countCJK(text), used: used, gram: gram};
}
function updateMeter(meter, text){
  var r = analyze(text), chk = state.asg.check || {};
  meter.innerHTML = '';
  if (chk.words && chk.words.length){
    var need = chk.minWords || 0;
    meter.appendChild(el('span', {cls:'pill ' + (r.used.length >= need ? 'ok' : ''), text: 'Từ của bài: ' + r.used.length + (need ? ' / ' + need : '')}));
  }
  r.gram.forEach(function(g){ meter.appendChild(el('span', {cls:'pill zh ' + (g.ok ? 'ok' : ''), text: (g.ok ? '✓ ' : '○ ') + g.label})); });
}
/* Bộ đếm chữ: đếm chữ Hán, không tính dấu câu, chữ cái, số và khoảng trắng. */
function updateCounter(box, s, text){
  var n = countCJK(text), min = s.minChars || 0, ok = !min || n >= min;
  box.className = 'counter' + (ok ? ' ok' : '');
  box.innerHTML = '';
  box.appendChild(el('div', null, [
    el('span', {cls:'num', text: String(n)}),
    el('span', {text: min ? ' / ' + min + ' chữ' : ' chữ'}),
    el('span', {text: min ? (ok ? '  ·  Đã đủ số chữ' : '  ·  Còn thiếu ' + (min - n) + ' chữ') : ''})
  ]));
  if (min){
    var tr = el('div', {cls:'track'}, [el('div', {cls:'fill'})]);
    tr.firstChild.style.width = Math.min(100, Math.round(n / min * 100)) + '%';
    box.appendChild(tr);
  }
  var bc = $('barCount');
  bc.className = ok ? 'ok' : '';
  bc.textContent = 'Đoạn văn: ' + n + (min ? '/' + min : '') + ' chữ';
}

/* ---------- Xem bài đã nộp, điểm và nhận xét ---------- */
function optText(it, L){
  var k = 'ABCDEFGH'.indexOf(String(L || ''));
  return k >= 0 && it.options && it.options[k] != null ? L + '. ' + it.options[k] : String(L || '');
}
function ansText(it, v){
  if (it.type === 'word_sentence'){ v = v || {}; return (v.word ? '【' + v.word + '】 ' : '') + (v.sentence || ''); }
  if (it.type === 'choice') return v ? optText(it, v) : '';
  return v == null ? '' : String(v);
}
function fbBox(text){
  if (!String(text || '').trim()) return null;
  return el('div', {cls:'fb'}, [el('div', {cls:'h', text:'Nhận xét của giáo viên'}), el('div', {cls:'tx', text: text})]);
}
function renderReview(){
  var a = state.asg, sub = state.sub, f = $('form'), graded = sub && sub.returned;
  var cm = (graded && sub.comments) || {};
  f.innerHTML = '';
  var head = el('div', {cls:'card'}, [el('h2', {text: a.title})]);
  if (!sub) head.appendChild(el('div', {cls:'notice warn', text:'Bạn chưa nộp bài này.'}));
  else if (graded) head.appendChild(el('div', {cls:'notice ok', text:'Giáo viên đã chấm và trả bài lúc ' + fmtTime(sub.returnedAt) + '. Bài không sửa được nữa.'}));
  else head.appendChild(el('div', {cls:'notice info', text:'Bạn đã nộp lúc ' + fmtTime(sub.lastAt) + '. ' + (a.active ? '' : 'Bài tập đã hết hạn nên không sửa được nữa. ') + 'Đang chờ giáo viên chấm.'}));
  f.appendChild(head);
  if (graded){
    f.appendChild(el('div', {cls:'card scorebox'}, [
      el('div', {cls:'sc'}, [document.createTextNode(sub.score || '–'), el('small', {text:'điểm'})]),
      el('div', {cls:'tx', text: 'Điểm do giáo viên chấm. Xem nhận xét từng câu ở bên dưới.'})
    ]));
    if (String(sub.feedback || '').trim()) f.appendChild(el('div', {cls:'card'}, [el('h3', {text:'Nhận xét chung'}), el('div', {cls:'fbAll', text: sub.feedback})]));
  }
  if (!sub) return;
  (a.sections || []).forEach(function(s){
    var c = el('div', {cls:'card'}, [el('h3', {text: s.title})]);
    if (s.type === 'essay'){
      var v = sub.answers[s.id] || {};
      if (v.topic) c.appendChild(el('div', {cls:'small muted', text:'Chủ đề: ' + v.topic}));
      c.appendChild(String(v.text || '').trim() ? el('div', {cls:'essayView', text: v.text}) : el('div', {cls:'rv'}, [el('div', {cls:'mine empty', text:'(chưa viết)'})]));
      c.appendChild(el('div', {cls:'small muted', style:'margin-top:6px', text: countCJK(v.text) + ' chữ'}));
      var fe = fbBox(cm[s.id]); if (fe) c.appendChild(fe);
    } else {
      if (s.passage) c.appendChild(el('div', {cls:'passage', text: s.passage}));
      (s.items || []).forEach(function(it, i){
        var t = ansText(it, sub.answers[it.id]), k = state.keys[it.id];
        var isCh = it.type === 'choice' && k;
        var mine = el('div', {cls:'mine' + (t.trim() ? '' : ' empty'), text: t.trim() ? t : '(bỏ trống)'});
        if (isCh) mine.appendChild(sub.answers[it.id] === k ? el('span', {cls:'mk ok', text:'✓ Đúng'}) : el('span', {cls:'mk no', text:'✗ Sai'}));
        c.appendChild(el('div', {cls:'rv'}, [
          itemHead(s, it, i),
          mine,
          k && !(isCh && sub.answers[it.id] === k) ? el('div', {cls:'key'}, [el('b', {text: isCh ? 'Đáp án đúng: ' : 'Đáp án tham khảo: '}), document.createTextNode(isCh ? optText(it, k) : k)]) : null,
          fbBox(cm[it.id])
        ]));
      });
    }
    f.appendChild(c);
  });
}

/* ---------- Nộp bài ---------- */
function emptyItems(){
  var miss = [];
  (state.asg.sections || []).forEach(function(s){
    if (s.type === 'essay'){ if (!String((state.answers[s.id] || {}).text || '').trim()) miss.push(s.title); return; }
    var blank = (s.items || []).filter(function(it){
      var v = state.answers[it.id];
      if (it.type === 'word_sentence') return !v || !String(v.sentence || '').trim();
      return !String(v || '').trim();
    }).length;
    if (blank) miss.push(s.title + ' (còn ' + blank + ' câu trống)');
  });
  return miss;
}
function modal(html, buttons){
  var box = $('modalBox'); box.innerHTML = html;
  var act = el('div', {cls:'actions'});
  buttons.forEach(function(b){
    var x = el('button', {cls:'btn' + (b.ghost ? ' ghost' : ''), type:'button', text: b.text});
    x.addEventListener('click', b.on); act.appendChild(x);
  });
  box.appendChild(act);
  $('modal').classList.remove('hidden');
}
function closeModal(){ $('modal').classList.add('hidden'); }

$('submitBtn').addEventListener('click', function(){
  var a = state.asg, upd = !!state.sub;
  var essay = (a.sections || []).filter(function(s){ return s.type === 'essay'; })[0];
  if (essay){
    var n = countCJK((state.answers[essay.id] || {}).text || '');
    if (essay.minChars && n < essay.minChars){
      modal('<h2>Đoạn văn chưa đủ chữ</h2><p>Bài viết mới có <b>' + n + '</b> chữ, cần ít nhất <b>' + essay.minChars + '</b> chữ.</p>', [{text:'Viết tiếp', on: closeModal}]);
      return;
    }
  }
  var miss = emptyItems();
  var html = '<h2>' + (upd ? 'Cập nhật bài nộp?' : 'Nộp bài?') + '</h2><p>Tên: <b class="zh">' + esc(state.name) + '</b></p>';
  if (upd) html += '<p class="small muted">Bài mới sẽ thay bài bạn đã nộp lúc ' + esc(fmtTime(state.sub.lastAt)) + '.</p>';
  if (miss.length) html += '<p>Còn phần chưa làm:</p><ul>' + miss.map(function(m){ return '<li>' + esc(m) + '</li>'; }).join('') + '</ul>';
  modal(html, [{text:'Xem lại', ghost:true, on: closeModal}, {text: upd ? 'Cập nhật' : 'Nộp bài', on: doSubmit}]);
});

function doSubmit(){
  var a = state.asg;
  $('modalBox').innerHTML = '<p><span class="spinner"></span> Đang gửi bài…</p>';
  call('submit', a.id, state.name, state.answers).then(function(r){
    closeModal();
    store(draftKey(a.id), null); store('draft:' + a.id, null);
    $('doneTitle').textContent = r.resubmitted ? 'Đã cập nhật bài nộp' : 'Đã nộp bài';
    $('doneText').textContent = state.name + ' · ' + a.title + '. Bạn vẫn sửa được cho đến khi giáo viên chấm hoặc hết hạn.';
    show('vDone');
  }).catch(function(e){
    var m = errMsg(e), closed = /hết thời gian|chưa mở|đã chấm/.test(m);
    modal('<h2>Chưa gửi được</h2><p class="err">' + esc(m) + '</p><p class="small muted">Bài làm của bạn vẫn còn trên máy.' + (closed ? '' : ' Hãy thử lại.') + '</p>', [{text:'Đóng', on: closeModal}]);
  });
}

setInterval(function(){
  var d = $('deadline');
  if (d && state.asg && state.asg.until && !$('vWork').classList.contains('hidden')) d.textContent = deadlineText(state.asg.until);
}, 30000);

$('back').addEventListener('click', goHome);
$('doneBack').addEventListener('click', goHome);
$('modal').addEventListener('click', function(e){ if (e.target === $('modal')) closeModal(); });

var saved = store('hw_name');
if (saved){ setUser(saved); goHome(); } else showLogin();
</script>
</body>
